<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista de Compras</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f4;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
  padding:16px;
}

h1{
  text-align:center;
  margin-bottom:4px;
}

.status{
  text-align:center;
  margin-bottom:20px;
  color:#198754;
  font-size:14px;
}

.card{
  background:white;
  padding:16px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  margin-bottom:16px;
}

.form{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:10px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

.adicionar{
  grid-column:1/-1;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#198754;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.item{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.topo{
  display:flex;
  align-items:center;
  gap:10px;
}

.check{
  width:23px;
  height:23px;
}

.nome{
  flex:1;
  font-size:18px;
  font-weight:bold;
}

.comprado .nome{
  text-decoration:line-through;
  color:#999;
}

.excluir{
  border:0;
  background:#dc3545;
  color:white;
  padding:8px 10px;
  border-radius:7px;
}

.detalhes{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:10px;
  margin-top:15px;
}

label{
  display:block;
  font-size:12px;
  color:#777;
  margin-bottom:5px;
}

.subtotal{
  margin-top:12px;
  text-align:right;
}

.total{
  background:#198754;
  color:white;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

.totalLinha{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.totalValor{
  font-size:29px;
  font-weight:bold;
}

.resumo{
  margin-top:8px;
  font-size:13px;
}

.vazio{
  text-align:center;
  padding:30px;
  color:#888;
}

.limpar{
  width:100%;
  margin-top:15px;
  padding:13px;
  background:white;
  color:#dc3545;
  border:1px solid #dc3545;
  border-radius:9px;
  font-weight:bold;
}

.sincronizando{
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Lista de Compras</h1>

<div id="status" class="status sincronizando">
  Conectando...
</div>

<div class="card">

  <div class="form">

    <input
      id="produto"
      type="text"
      placeholder="Nome do produto"
      autocomplete="off"
    >

    <input
      id="quantidade"
      type="number"
      min="1"
      value="1"
      placeholder="Qtd."
    >

    <button
      class="adicionar"
      onclick="adicionarProduto()"
    >
      + Adicionar produto
    </button>

  </div>

</div>

<div id="lista"></div>

<div class="total">

  <div class="totalLinha">

    <span>
      TOTAL DA COMPRA
    </span>

    <span
      id="total"
      class="totalValor"
    >
      R$ 0,00
    </span>

  </div>

  <div
    id="resumo"
    class="resumo"
  >
    0 produtos
  </div>

</div>

<button
  class="limpar"
  onclick="limparLista()"
>
  Limpar toda a lista
</button>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyAOCPTESMzSpfPFl2np5a-HgMWoE6XQ7m4",

  authDomain:
  "listadecompra-ce2b5.firebaseapp.com",

  databaseURL:
  "https://listadecompra-ce2b5-default-rtdb.firebaseio.com",

  projectId:
  "listadecompra-ce2b5",

  storageBucket:
  "listadecompra-ce2b5.firebasestorage.app",

  messagingSenderId:
  "944177336346",

  appId:
  "1:944177336346:web:e51d799e571b86a85041a3"

};


const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);

const listaRef =
  ref(database,"listaCompras");


let produtos = {};


const status =
  document.getElementById("status");


onValue(

  listaRef,

  (snapshot)=>{

    produtos =
      snapshot.val() || {};

    status.textContent =
      "● Lista sincronizada";

    status.classList.remove(
      "sincronizando"
    );

    mostrarLista();

  },

  (erro)=>{

    console.error(erro);

    status.textContent =
      "Erro ao conectar ao Firebase";

  }

);


window.adicionarProduto =
async function(){

  const campoProduto =
    document.getElementById("produto");

  const campoQuantidade =
    document.getElementById("quantidade");


  const nome =
    campoProduto.value.trim();

  const quantidade =
    Math.max(
      1,
      Number(campoQuantidade.value) || 1
    );


  if(!nome){

    alert(
      "Digite o nome do produto."
    );

    return;

  }


  const novoProduto =
    push(listaRef);


  await set(
    novoProduto,
    {

      nome:nome,

      quantidade:quantidade,

      preco:0,

      comprado:false,

      criadoEm:Date.now()

    }
  );


  campoProduto.value = "";

  campoQuantidade.value = 1;

  campoProduto.focus();

};


window.alterarQuantidade =
async function(id,valor){

  let quantidade =
    Number(valor);

  if(
    !quantidade ||
    quantidade < 1
  ){
    quantidade = 1;
  }

  await update(
    ref(
      database,
      "listaCompras/" + id
    ),
    {
      quantidade:quantidade
    }
  );

};


window.alterarPreco =
async function(id,valor){

  let preco =
    parseFloat(
      String(valor)
      .replace(",",".")
    );

  if(
    !Number.isFinite(preco) ||
    preco < 0
  ){
    preco = 0;
  }

  await update(
    ref(
      database,
      "listaCompras/" + id
    ),
    {
      preco:preco
    }
  );

};


window.marcarComprado =
async function(id,valor){

  await update(
    ref(
      database,
      "listaCompras/" + id
    ),
    {
      comprado:valor
    }
  );

};


window.excluirProduto =
async function(id){

  if(
    !confirm(
      "Excluir este produto?"
    )
  ){
    return;
  }

  await remove(
    ref(
      database,
      "listaCompras/" + id
    )
  );

};


window.limparLista =
async function(){

  if(
    !confirm(
      "Apagar todos os produtos da lista?"
    )
  ){
    return;
  }

  await remove(listaRef);

};


function dinheiro(valor){

  return Number(valor || 0)
  .toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


function escapar(texto){

  const div =
    document.createElement("div");

  div.textContent =
    texto || "";

  return div.innerHTML;

}


function mostrarLista(){

  const lista =
    document.getElementById("lista");


  lista.innerHTML = "";


  const itens =
    Object.entries(produtos);


  if(itens.length === 0){

    lista.innerHTML = `
      <div class="vazio">
        Sua lista está vazia.<br><br>
        Adicione os produtos que vocês
        precisam comprar.
      </div>
    `;

  }


  itens

  .sort(
    (a,b)=>
    (a[1].criadoEm || 0) -
    (b[1].criadoEm || 0)
  )

  .forEach(
    ([id,item])=>{

      const quantidade =
        Number(item.quantidade) || 1;

      const preco =
        Number(item.preco) || 0;

      const subtotal =
        quantidade * preco;


      const div =
        document.createElement("div");


      div.className =
        "item" +
        (
          item.comprado
          ? " comprado"
          : ""
        );


      div.innerHTML = `

        <div class="topo">

          <input
            class="check"
            type="checkbox"
            ${item.comprado
              ? "checked"
              : ""
            }
            onchange="
              marcarComprado(
                '${id}',
                this.checked
              )
            "
          >

          <div class="nome">
            ${escapar(item.nome)}
          </div>

          <button
            class="excluir"
            onclick="
              excluirProduto('${id}')
            "
          >
            Excluir
          </button>

        </div>


        <div class="detalhes">

          <div>

            <label>
              Quantidade
            </label>

            <input
              type="number"
              min="1"
              value="${quantidade}"
              onchange="
                alterarQuantidade(
                  '${id}',
                  this.value
                )
              "
            >

          </div>


          <div>

            <label>
              Preço unitário (R$)
            </label>

            <input
              type="number"
              inputmode="decimal"
              min="0"
              step="0.01"
              placeholder="0,00"

              value="${
                preco > 0
                ? preco
                : ""
              }"

              onchange="
                alterarPreco(
                  '${id}',
                  this.value
                )
              "
            >

          </div>

        </div>


        <div class="subtotal">

          Subtotal:

          <strong>
            ${dinheiro(subtotal)}
          </strong>

        </div>

      `;


      lista.appendChild(div);

    }
  );


  atualizarTotal();

}


function atualizarTotal(){

  let total = 0;

  let comprados = 0;


  Object.values(produtos)
  .forEach(item=>{

    const quantidade =
      Number(item.quantidade) || 1;

    const preco =
      Number(item.preco) || 0;


    total +=
      quantidade * preco;


    if(item.comprado){
      comprados++;
    }

  });


  const quantidadeProdutos =
    Object.keys(produtos).length;


  document
  .getElementById("total")
  .textContent =
    dinheiro(total);


  document
  .getElementById("resumo")
  .textContent =
    quantidadeProdutos +
    " produtos • " +
    comprados +
    " no carrinho";

}


document
.getElementById("produto")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      adicionarProduto();
    }

  }
);

</script>

</body>
</html>
