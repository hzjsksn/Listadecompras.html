<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Lista de Compras</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f5;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitulo {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  margin-bottom: 18px;
}

.formulario {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 10px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

.adicionar {
  grid-column: 1 / -1;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #198754;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.item {
  background: white;
  padding: 15px;
  border-radius: 13px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.item-topo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.checkbox {
  width: 22px;
  height: 22px;
}

.nome {
  flex: 1;
  font-size: 18px;
  font-weight: bold;
}

.comprado .nome {
  text-decoration: line-through;
  color: #999;
}

.excluir {
  background: #dc3545;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 8px 10px;
  cursor: pointer;
}

.detalhes {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 10px;
  margin-top: 15px;
}

.campo label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-bottom: 5px;
}

.subtotal {
  margin-top: 12px;
  text-align: right;
  font-size: 15px;
}

.total-card {
  background: #198754;
  color: white;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

.total-linha {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.total-label {
  font-size: 16px;
}

.total-valor {
  font-size: 30px;
  font-weight: bold;
}

.resumo {
  margin-top: 8px;
  font-size: 13px;
  opacity: .9;
}

.limpar {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: 1px solid #dc3545;
  background: white;
  color: #dc3545;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.vazio {
  text-align: center;
  padding: 30px 10px;
  color: #888;
}
</style>
</head>

<body>

<div class="container">

  <h1>🛒 Lista de Compras</h1>
  <div class="subtitulo">
    Monte a lista em casa e coloque os preços no mercado
  </div>

  <div class="card">
    <div class="formulario">

      <input
        id="produto"
        type="text"
        placeholder="Nome do produto"
      >

      <input
        id="quantidade"
        type="number"
        value="1"
        min="1"
        step="1"
        placeholder="Qtd."
      >

      <button
        class="adicionar"
        onclick="adicionarProduto()"
      >
        + Adicionar à lista
      </button>

    </div>
  </div>

  <div id="lista"></div>

  <div class="total-card">

    <div class="total-linha">
      <div class="total-label">
        TOTAL DA COMPRA
      </div>

      <div
        class="total-valor"
        id="total"
      >
        R$ 0,00
      </div>
    </div>

    <div
      class="resumo"
      id="resumo"
    >
      0 produtos na lista
    </div>

  </div>

  <button
    class="limpar"
    onclick="limparLista()"
  >
    Limpar lista
  </button>

</div>

<script>

let produtos =
  JSON.parse(localStorage.getItem("minhaListaCompras")) || [];

function salvar() {
  localStorage.setItem(
    "minhaListaCompras",
    JSON.stringify(produtos)
  );
}

function moeda(valor) {
  return valor.toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );
}

function adicionarProduto() {

  const produto =
    document.getElementById("produto");

  const quantidade =
    document.getElementById("quantidade");

  const nome =
    produto.value.trim();

  if (!nome) {
    alert("Digite o nome do produto.");
    produto.focus();
    return;
  }

  produtos.push({
    nome: nome,
    quantidade:
      Math.max(
        1,
        Number(quantidade.value) || 1
      ),
    preco: 0,
    comprado: false
  });

  produto.value = "";
  quantidade.value = 1;

  salvar();
  mostrarLista();

  produto.focus();
}

function atualizarQuantidade(index, valor) {

  let quantidade =
    Number(valor);

  if (!quantidade || quantidade < 1) {
    quantidade = 1;
  }

  produtos[index].quantidade =
    quantidade;

  salvar();
  mostrarLista();
}

function atualizarPreco(index, valor) {

  let preco =
    String(valor)
      .replace(",", ".");

  preco =
    parseFloat(preco) || 0;

  produtos[index].preco =
    preco;

  salvar();
  atualizarTotal();
}

function marcarComprado(index) {

  produtos[index].comprado =
    !produtos[index].comprado;

  salvar();
  mostrarLista();
}

function excluirProduto(index) {

  produtos.splice(index, 1);

  salvar();
  mostrarLista();
}

function atualizarTotal() {

  let total = 0;

  produtos.forEach(item => {

    total +=
      Number(item.quantidade) *
      Number(item.preco || 0);

  });

  document.getElementById("total")
    .textContent =
    moeda(total);

  const comprados =
    produtos.filter(
      item => item.comprado
    ).length;

  document.getElementById("resumo")
    .textContent =
    `${produtos.length} produtos • ${comprados} no carrinho`;
}

function mostrarLista() {

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";

  if (produtos.length === 0) {

    lista.innerHTML = `
      <div class="vazio">
        Sua lista está vazia.<br>
        Adicione os produtos que precisa comprar.
      </div>
    `;

    atualizarTotal();
    return;
  }

  produtos.forEach((item, index) => {

    const subtotal =
      Number(item.quantidade) *
      Number(item.preco || 0);

    const div =
      document.createElement("div");

    div.className =
      "item" +
      (item.comprado ? " comprado" : "");

    div.innerHTML = `

      <div class="item-topo">

        <input
          class="checkbox"
          type="checkbox"
          ${item.comprado ? "checked" : ""}
          onchange="marcarComprado(${index})"
        >

        <div class="nome">
          ${escaparHTML(item.nome)}
        </div>

        <button
          class="excluir"
          onclick="excluirProduto(${index})"
        >
          Excluir
        </button>

      </div>

      <div class="detalhes">

        <div class="campo">
          <label>Quantidade</label>

          <input
            type="number"
            min="1"
            step="1"
            value="${item.quantidade}"
            onchange="
              atualizarQuantidade(
                ${index},
                this.value
              )
            "
          >
        </div>

        <div class="campo">
          <label>Preço unitário (R$)</label>

          <input
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            placeholder="0,00"
            value="${
              item.preco > 0
              ? item.preco
              : ""
            }"
            oninput="
              atualizarPreco(
                ${index},
                this.value
              )
            "
          >
        </div>

      </div>

      <div class="subtotal">
        Subtotal:
        <strong id="subtotal-${index}">
          ${moeda(subtotal)}
        </strong>
      </div>

    `;

    lista.appendChild(div);
  });

  atualizarTotal();
}

function atualizarPreco(index, valor) {

  let preco =
    parseFloat(
      String(valor).replace(",", ".")
    ) || 0;

  produtos[index].preco =
    preco;

  salvar();

  const subtotal =
    produtos[index].quantidade *
    preco;

  const campoSubtotal =
    document.getElementById(
      `subtotal-${index}`
    );

  if (campoSubtotal) {
    campoSubtotal.textContent =
      moeda(subtotal);
  }

  atualizarTotal();
}

function limparLista() {

  if (produtos.length === 0) {
    return;
  }

  const confirmar =
    confirm(
      "Tem certeza que deseja apagar toda a lista?"
    );

  if (!confirmar) {
    return;
  }

  produtos = [];

  salvar();
  mostrarLista();
}

function escaparHTML(texto) {

  const div =
    document.createElement("div");

  div.textContent = texto;

  return div.innerHTML;
}

document
  .getElementById("produto")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        adicionarProduto();
      }

    }
  );

mostrarLista();

</script>

</body>
